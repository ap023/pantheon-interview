# takt_s is a string, not a number. Loads fine (valid YAML, valid dict
# shape), so it's not caught by config-resolution error handling either
# — it only breaks later, in run_cycle's `takt_s / physics_dt` division,
# as an uncaught TypeError.
takt_s: "fast"
position_tolerance_rad: 0.05
control_gain_kp: 4.0
autoclear: false
calibration_max_age_s: 300.0
